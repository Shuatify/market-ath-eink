name: Publish Market ATH Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even when NYSE is closed'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: market-ath-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check actual NYSE market window
        id: gate
        shell: bash
        env:
          FORCE_PUBLISH: ${{ inputs.force }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$FORCE_PUBLISH" == "true" ]]; then
            should_publish=true
          elif python - <<'PYCHECK'
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from build import market_window

          now = datetime.now(ZoneInfo("America/New_York"))
          sys.exit(0 if market_window(now) else 1)
          PYCHECK
          then
            should_publish=true
          else
            should_publish=false
            echo "NYSE is closed; skipping deployment."
          fi

          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
      - name: Generate live dashboard
        if: steps.gate.outputs.should_publish == 'true'
        run: python build.py
      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.should_publish == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.gate.outputs.should_publish == 'true'
        with:
          path: ./site
  deploy:
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
