name: Publish Market ATH Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # NYSE weekdays; timezone automatically handles EST/EDT transitions.
    # Scheduled runs can be delayed/skipped by GitHub.
    - cron: '36,46,56 9 * * 1-5'
      timezone: America/New_York
    - cron: '6,16,26,36,46,56 10-15 * * 1-5'
      timezone: America/New_York
    - cron: '6,16,26 16 * * 1-5'
      timezone: America/New_York

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: market-ath-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check actual NYSE market window
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]] || python -c "from datetime import datetime; from zoneinfo import ZoneInfo; from build import market_window; import sys; sys.exit(0 if market_window(datetime.now(ZoneInfo('America/New_York'))) else 1)"; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "NYSE is closed; no data fetch or deployment."
          fi
      - name: Generate live dashboard
        if: steps.gate.outputs.should_publish == 'true'
        run: python build.py
      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.should_publish == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.gate.outputs.should_publish == 'true'
        with:
          path: ./site
  deploy:
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
